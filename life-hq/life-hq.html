<title>Life HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed 3D building of life areas, glass HUD at top and bottom, one bottom sheet for a room. */
:root{
  --bg:#0e1130; --panel:rgba(20,24,64,.84); --panel-solid:#171b48; --fg:#eef0ff; --muted:#a6abd8;
  --line:rgba(170,180,255,.22); --accent:#f5b971; --accent-strong:#c2652a; --field:rgba(255,255,255,.06);
  --ok:#34d399; --idle:#9aa3c7; --done:#60a5fa; --err:#fb7185;
  --display:"Bricolage Grotesque","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body.day{
  --bg:#dce7f3; --panel:rgba(255,255,255,.9); --panel-solid:#ffffff; --fg:#1c2042; --muted:#5a5f86;
  --line:rgba(40,50,110,.16); --accent:#b4531c; --accent-strong:#c2652a; --field:rgba(20,30,80,.04);
  --ok:#059669; --idle:#6b7398; --done:#2563eb; --err:#e11d48;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;transition:background .5s}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hud{position:fixed;left:0;right:0;z-index:5;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud>*{pointer-events:auto}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;pointer-events:none}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,34px);letter-spacing:-.02em;line-height:1}
.brand h1 b{color:var(--accent);font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:13px}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:5px 11px;font-size:12.5px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.chip .n{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--idle)}
.s-working .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.s-done .dot{background:var(--done)}
.s-error .dot{background:var(--err);animation:blink 1s infinite}
.s-idle .dot{background:var(--idle)}
@keyframes blink{50%{opacity:.25}}

.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:8px}
.ticker{align-self:flex-start;max-width:100%;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:6px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:12px;padding:9px 13px;font-size:13.5px;font-weight:500}
.btn.primary{background:var(--accent-strong);border-color:transparent;color:#fff}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.tag{position:absolute;left:0;top:0;pointer-events:auto;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:999px;padding:4px 10px 4px 8px;font-size:12px;font-weight:600;transition:opacity .25s}
.tag .sw{width:10px;height:10px;border-radius:3px}
.tag .c{font-family:var(--mono);font-weight:500;color:var(--muted);font-size:11px}
.tag.dim{opacity:.28}
.tag.add{border-style:dashed;color:var(--muted);font-weight:500}

.sheet{position:fixed;z-index:10;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,105%);
  transition:transform .32s cubic-bezier(.2,.8,.2,1);background:var(--panel-solid);border:1px solid var(--line);border-bottom:0;
  border-radius:20px 20px 0 0;max-height:82%;overflow:auto;box-shadow:0 -20px 50px rgba(0,0,0,.35);
  padding-block:8px calc(env(safe-area-inset-bottom,0px) + 18px);
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.sheet.open{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sh-head{display:flex;align-items:center;gap:12px}
.badge{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;font-size:18px}
.sh-head h2{margin:0;font-family:var(--display);font-size:21px;line-height:1.15;text-wrap:balance}
.sh-head .sub{color:var(--muted);font-size:13px}
.sh-head>div{min-width:0}
.x{margin-inline-start:auto;border:1px solid var(--line);background:transparent;border-radius:10px;width:36px;height:36px;font-size:18px;flex:none}
.sec{margin-top:18px}
.sec h3{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.sec h3 span{font-family:var(--mono);letter-spacing:0;text-transform:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .6s}
.field{width:100%;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 11px;font-size:15px}
.goal{font-size:15px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.task .tx{flex:1;min-width:0;font-size:14.5px;overflow-wrap:anywhere}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.task .due{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block}
.task .due.late{color:var(--err)}
.task.urgent{border-color:var(--err)}
.ib{border:0;background:transparent;width:30px;height:30px;border-radius:8px;color:var(--muted);flex:none;font-size:15px}
.ib[aria-pressed="true"]{color:var(--err)}
.addform{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}
.addform .opts{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.addform .opts input[type=date]{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:5px 8px;font-size:13px}
.addform .opts label{display:inline-flex;align-items:center;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.sug{border:1px dashed var(--line);background:transparent;border-radius:999px;padding:6px 11px;font-size:13px}
.sw-row{display:flex;gap:8px;flex-wrap:wrap}
.sw-row button{width:30px;height:30px;border-radius:9px;border:2px solid transparent}
.sw-row button[aria-pressed="true"]{border-color:var(--fg)}
.plain{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:13px}
.plain.danger{color:var(--err)}
.empty{color:var(--muted);font-size:14px;margin:0}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.catalog button{text-align:start;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.catalog .badge{width:32px;height:32px;font-size:14px;border-radius:9px}
.catalog small{display:block;color:var(--muted);font-size:12px}
.custom{display:flex;flex-direction:column;gap:8px}
.custom select{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:9px 11px}
.custom select option{background:var(--panel-solid)}
.note{font-size:12px;color:var(--muted);margin-top:16px}
.hint{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--panel);border:1px solid var(--line);
  padding:8px 14px;border-radius:999px;font-size:13px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}.s-error .dot{animation:none}}
</style>

<div id="stage"></div>
<div id="labels"></div>

<header class="hud top">
  <div class="brand">
    <h1 id="h1"></h1>
    <p id="subtitle"></p>
  </div>
  <div class="meta" id="meta"></div>
  <div class="chips" id="chips"></div>
</header>

<div class="hint" id="hint"></div>

<footer class="hud bottom">
  <div class="ticker" id="ticker"></div>
  <div class="bar">
    <button class="btn" id="btnDay"></button>
    <button class="btn" id="btnLang"></button>
    <button class="btn" id="btnReset"></button>
    <button class="btn primary" id="btnAdd"></button>
  </div>
</footer>

<section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="shTitle"><div class="grab"></div><div id="sheetBody"></div></section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
// ---------- life areas ----------
const AREAS = {
  health:{order:0,color:'#ef4444',kind:'gym',initial:'H',
    name:{en:'Health & Fitness',ar:'الصحة واللياقة'},role:{en:'Health coach',ar:'مدرب الصحة'},
    sug:[['Gym 3 times this week','نادي 3 مرات هالأسبوع'],['Drink 2L of water a day','اشرب لترين ماء يوميًا'],['Sleep before midnight','نام قبل 12'],['Book a checkup','احجز فحص طبي']]},
  money:{order:1,color:'#22c55e',kind:'coins',initial:'$',
    name:{en:'Money',ar:'الفلوس'},role:{en:'Money manager',ar:'مدير الفلوس'},
    sug:[['Track this month\'s spending','تابع مصاريف هالشهر'],['Save 10% of my salary','وفّر 10% من الراتب'],['Pay off the credit card','سدد البطاقة'],['Cancel unused subscriptions','الغِ الاشتراكات اللي ما تستخدمها']]},
  career:{order:2,color:'#3b82f6',kind:'trophy',initial:'W',
    name:{en:'Work & Career',ar:'العمل والمسيرة'},role:{en:'Career manager',ar:'مدير المسيرة'},
    sug:[['Update my CV','حدّث السيرة الذاتية'],['Finish the weekly report','خلّص التقرير الأسبوعي'],['Ask my manager for feedback','اطلب رأي المدير'],['Learn one new work tool','تعلّم أداة شغل جديدة']]},
  learning:{order:3,color:'#a855f7',kind:'books',initial:'L',
    name:{en:'Learning',ar:'التعلّم'},role:{en:'Learning coach',ar:'مدرب التعلّم'},
    sug:[['Read 20 pages','اقرأ 20 صفحة'],['Finish one course lesson','خلّص درس من الكورس'],['Practice English for 15 min','تمرّن إنجليزي 15 دقيقة']]},
  family:{order:4,color:'#ec4899',kind:'people',initial:'F',
    name:{en:'Family',ar:'العائلة'},role:{en:'Family keeper',ar:'مسؤول العائلة'},
    sug:[['Call mom','اتصل على الوالدة'],['Family dinner on Friday','عشاء عائلي يوم الجمعة'],['Visit the grandparents','زور الجد والجدة']]},
  mind:{order:5,color:'#14b8a6',kind:'zen',initial:'M',
    name:{en:'Mind & Peace',ar:'الذهن والراحة'},role:{en:'Mind coach',ar:'مدرب الذهن'},
    sug:[['10 minutes of quiet time','10 دقائق هدوء'],['Write in my journal tonight','اكتب يومياتك الليلة'],['No phone after 11 pm','بدون جوال بعد 11']]},
  home:{order:6,color:'#f59e0b',kind:'sofa',initial:'B',
    name:{en:'Home',ar:'البيت'},role:{en:'Home manager',ar:'مدير البيت'},
    sug:[['Tidy my room','رتّب الغرفة'],['Get the AC serviced','صيانة المكيف'],['Buy groceries','اشتر أغراض البيت']]},
  fun:{order:7,color:'#6366f1',kind:'globe',initial:'T',
    name:{en:'Fun & Travel',ar:'الترفيه والسفر'},role:{en:'Fun planner',ar:'منظم الطلعات'},
    sug:[['Plan a weekend trip','خطط لطلعة نهاية الأسبوع'],['Movie night with friends','فلم مع الربع'],['Try a new café','جرّب مقهى جديد']]},
};
const PRESETS = {
  friends:{color:'#f97316',kind:'people',initial:'R',name:{en:'Friends',ar:'الربع'},role:{en:'Social planner',ar:'منظم الجمعات'},
    sug:[['Message an old friend','راسل صديق قديم'],['Plan a gathering','رتّب جمعة']]},
  projects:{color:'#0ea5e9',kind:'machine',initial:'P',name:{en:'Side Projects',ar:'المشاريع الجانبية'},role:{en:'Project builder',ar:'باني المشاريع'},
    sug:[['Write down 3 project ideas','اكتب 3 أفكار مشاريع'],['Work 1 hour on my project','اشتغل ساعة على مشروعي']]},
  car:{color:'#64748b',kind:'car',initial:'C',name:{en:'Car',ar:'السيارة'},role:{en:'Car keeper',ar:'مسؤول السيارة'},
    sug:[['Oil change','غيّر الزيت'],['Renew the registration','جدد الملكية'],['Car wash','غسيل السيارة']]},
  faith:{color:'#10b981',kind:'zen',initial:'S',name:{en:'Faith',ar:'الروحانيات'},role:{en:'Faith companion',ar:'رفيق الروح'},
    sug:[]},
};
const KINDS = {gym:['Gym','نادي'],coins:['Coins','عملات'],trophy:['Trophy','كأس'],books:['Books','كتب'],people:['People','ناس'],
  zen:['Calm corner','ركن هادئ'],sofa:['Sofa','كنبة'],globe:['Globe','كرة أرضية'],machine:['Workshop','ورشة'],car:['Car','سيارة'],crates:['Boxes','صناديق']};
const SWATCHES = ['#ef4444','#f97316','#f59e0b','#84cc16','#22c55e','#14b8a6','#0ea5e9','#3b82f6','#6366f1','#a855f7','#ec4899','#64748b'];

const T = {
  en:{h1:'Life <b>HQ</b>',sub:'Every part of your life gets its own room',
      meta:(a,o,e)=>`${a} areas · ${o} open tasks · ${e} need you`,
      st:{working:'In progress',idle:'Empty',done:'All done',error:'Needs you'},
      day:'Day',night:'Night',lang:'عربي',reset:'Recenter',add:'+ Add room',
      goal:'Goal',goalPh:'What do you want here? e.g. lose 5 kg by March',tasks:'Tasks',addPh:'Add a task…',addBtn:'Add',
      due:'Due',urgent:'Urgent',ideas:'Ideas to start with',noTasks:'No tasks yet. Add one below or tap an idea.',
      clear:'Clear done',settings:'Room',rename:'Room name',color:'Color',remove:'Remove room',removeSure:'Tap again to remove',
      addT:'Add a room',addD:'Pick a ready room or make your own.',own:'Make your own',ownName:'Name, e.g. Gym, Studies, Wedding',prop:'Furniture',create:'Create room',
      close:'Close',del:'Delete task',flag:'Mark urgent',late:'late',today:'today',
      tickEmpty:'Tap a room to add your first task',tickDone:'Done',hint:'Drag to rotate · pinch to zoom · tap a room',
      saveCloud:'Saved to your account. Only you can see it.',saveLocal:'Saved on this device only.',saveFail:'Could not reach your saved data, so changes stay on this device for now.'},
  ar:{h1:'مقر <b>حياتي</b>',sub:'كل جزء من حياتك له غرفة',
      meta:(a,o,e)=>`${a} غرف · ${o} مهام مفتوحة · ${e} تحتاجك`,
      st:{working:'شغّال',idle:'فاضي',done:'خلّص',error:'يحتاجك'},
      day:'نهاري',night:'ليلي',lang:'EN',reset:'توسيط',add:'+ أضف غرفة',
      goal:'الهدف',goalPh:'وش تبي توصل له؟ مثلًا: أنزل 5 كيلو قبل مارس',tasks:'المهام',addPh:'أضف مهمة…',addBtn:'أضف',
      due:'الموعد',urgent:'عاجل',ideas:'أفكار للبداية',noTasks:'ما فيه مهام بعد. أضف وحدة تحت أو اختر فكرة.',
      clear:'امسح المنجز',settings:'الغرفة',rename:'اسم الغرفة',color:'اللون',remove:'احذف الغرفة',removeSure:'اضغط مرة ثانية للحذف',
      addT:'أضف غرفة',addD:'اختر غرفة جاهزة أو سوّ غرفتك.',own:'سوّ غرفتك',ownName:'الاسم، مثلًا: الجيم، الدراسة، العرس',prop:'الأثاث',create:'سوّ الغرفة',
      close:'إغلاق',del:'احذف المهمة',flag:'عاجل',late:'متأخر',today:'اليوم',
      tickEmpty:'اضغط على غرفة وأضف أول مهمة',tickDone:'تم',hint:'اسحب للتدوير · قرّب بإصبعين · اضغط على غرفة',
      saveCloud:'محفوظ في حسابك. أنت بس تشوفه.',saveLocal:'محفوظ على هذا الجهاز فقط.',saveFail:'ما قدرنا نوصل لبياناتك المحفوظة، فالتعديلات على هذا الجهاز حاليًا.'}
};

// ---------- prefs (per device) ----------
const pref = { get(k,d){try{const v=localStorage.getItem('lifehq:'+k);return v!=null?JSON.parse(v):d}catch(e){return d}},
               set(k,v){try{localStorage.setItem('lifehq:'+k,JSON.stringify(v))}catch(e){}} };
let lang = pref.get('lang','en');
const hr = new Date().getHours();
let night = pref.get('night', hr>=18 || hr<6);
let filter = null;

// ---------- data ----------
// saved[id] = {goal, tasks:[{id,text,done,due,urgent,doneAt}], title, color, kind, hidden, custom, order, preset}
let saved = {};
const dirty = {};
let mode = 'loading'; // cloud | local | fail
let col = null;
const writing = {}, pending = {};
const clone = o => JSON.parse(JSON.stringify(o||{}));
const uid = () => Math.random().toString(36).slice(2,9);

function loadLocal(){ saved = pref.get('data',{}); }
function persist(id){
  if(mode!=='cloud'){ pref.set('data',saved); return; }
  dirty[id]=true;
  if(writing[id]){ pending[id]=true; return; }
  writing[id]=true;
  const ref=col.doc(id);
  const p = saved[id] ? ref.set(clone(saved[id])) : ref.delete();
  p.catch(()=>{}).finally(()=>{ writing[id]=false;
    if(pending[id]){ pending[id]=false; persist(id); } else delete dirty[id]; });
}
async function initStore(){
  let c=window.claude;
  for(let i=0;i<10 && !(c&&c.use);i++){ await new Promise(r=>setTimeout(r,200)); c=window.claude; }
  if(!(c&&c.use)){ mode='local'; loadLocal(); refresh(); return; }
  try{
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    const id = user ? await user.id() : null;
    if(!db||!id){ mode='local'; loadLocal(); refresh(); return; }
    col=db.collection('data/users/'+id);
    let first=true;
    const timer=setTimeout(()=>{ if(first){ mode='fail'; loadLocal(); refresh(); } },10000);
    col.onSnapshot(snap=>{
      clearTimeout(timer);
      if(first && mode==='fail'){ /* late answer: switch to cloud */ }
      first=false; mode='cloud';
      const next={}; snap.docs.forEach(d=>{ next[d.id]=clone(d.data()); });
      Object.keys(dirty).forEach(k=>{ if(saved[k]) next[k]=saved[k]; else delete next[k]; });
      saved=next; refresh();
    },()=>{ clearTimeout(timer); if(first){ mode='fail'; loadLocal(); refresh(); } });
  }catch(e){ mode='local'; loadLocal(); refresh(); }
}

function area(id){
  const base=AREAS[id]||PRESETS[(saved[id]||{}).preset]||{};
  const s=saved[id]||{};
  return {id, color:s.color||base.color||'#64748b', kind:s.kind||base.kind||'crates',
    title:s.title||(base.name?base.name[lang]:'Room'), role:base.role?base.role[lang]:(lang==='ar'?'مساعدك':'Your helper'),
    initial:(s.title?[...s.title.trim()][0]||'•':base.initial||'•').toUpperCase(),
    sug:base.sug||[], goal:s.goal||'', tasks:s.tasks||[], custom:!AREAS[id], order:s.order!=null?s.order:(base.order!=null?base.order:99)};
}
function ids(){
  const all=new Set([...Object.keys(AREAS),...Object.keys(saved)]);
  return [...all].filter(k=>!(saved[k]&&saved[k].hidden) && (AREAS[k]||saved[k]&&saved[k].custom))
    .sort((a,b)=>area(a).order-area(b).order);

let sig='';
function build(){
  building.clear(); labelsEl.innerHTML=''; rooms={}; slabs=[]; walls=[];
  const list=ids();
  floors=Math.ceil((list.length+1)/2);
  for(let f=0;f<=floors;f++) slabs.push(slab(f*H-.12));
  list.forEach((id,i)=>rooms[id]=makeRoom(id,i));
  const i=list.length, f=Math.floor(i/2), col=i%2;
  const geo=new THREE.BoxGeometry(W-.6,H-.6,D-.6);
  const ln=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineDashedMaterial({color:0xa6abd8,dashSize:.25,gapSize:.18}));
  ln.computeLineDistances(); ln.position.set((col-.5)*W,f*H+H/2,0); building.add(ln);
  const pm=new THREE.MeshBasicMaterial({color:0xa6abd8});
  const plus=new THREE.Group(); plus.add(box(.9,.16,.16,pm)); plus.add(box(.16,.9,.16,pm)); plus.position.copy(ln.position); building.add(plus);
  const hit=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false})); hit.position.copy(ln.position); hit.userData.room='__add'; building.add(hit);
  const tag=document.createElement('button'); tag.className='tag add'; tag.onclick=openAdd; labelsEl.appendChild(tag);
  ghost={plus,hit,tag,anchor:new THREE.Vector3((col-.5)*W+W*.18,f*H+H-.15,D/2)};
  applyMode();
}
function structureSig(){ return ids().map(id=>{const a=area(id);return id+a.kind+a.color;}).join('|'); }

let fitH=20;
function fit(reset){
  const w=innerWidth,h=innerHeight; renderer.setSize(w,h);
  const aspect=w/h, bh=floors*H;
  fitH=Math.max(bh*1.12+4,12.5/aspect);
  camera.left=-fitH*aspect/2; camera.right=fitH*aspect/2; camera.top=fitH/2; camera.bottom=-fitH/2;
  camera.updateProjectionMatrix();
  if(reset){ const cy=bh/2-fitH*.04; controls.target.set(0,cy,0); camera.position.set(30,cy+22,30); camera.zoom=1; camera.updateProjectionMatrix(); controls.update(); }
}
addEventListener('resize',()=>fit(false));

function applyMode(){
  document.body.classList.toggle('day',!night);
  scene.background=new THREE.Color(night?0x0e1130:0xdce7f3);
  hemi.intensity=night?.45:.95; hemi.color.set(night?0x9aa0ff:0xffffff); hemi.groundColor.set(night?0x1a1840:0x8899aa);
  sun.intensity=night?.15:.75;
  Object.values(rooms).forEach(r=>{ r.lamp.intensity=night?1.1:.25; r.win.material.color.set(night?0x1e2a6e:0x9fd3ff); });
  slabs.forEach(s=>{ s.material.color.set(night?0x2b3170:0xf3f4f8); s.userData.edge.material.color.set(night?0x8f86ff:0xc2652a); s.userData.edge.material.opacity=night?.75:.35; });
  walls.forEach((w,i)=>w.material.color.set(night?(i%2?0x1d2452:0x222a5c):(i%2?0xd9deee:0xe9ecf5)));
}

  body.querySelectorAll('[data-tg]').forEach(b=>b.onchange=()=>edit(id,o=>{const x=o.tasks.find(k=>k.id===b.dataset.tg); if(x){x.done=b.checked; x.doneAt=b.checked?Date.now():null;}}));
  body.querySelectorAll('[data-fl]').forEach(b=>b.onclick=()=>edit(id,o=>{const x=o.tasks.find(k=>k.id===b.dataset.fl); if(x) x.urgent=!x.urgent;}));
  body.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>edit(id,o=>{o.tasks=o.tasks.filter(k=>k.id!==b.dataset.dl);}));
  const cl=body.querySelector('[data-clear]'); if(cl) cl.onclick=()=>edit(id,o=>{o.tasks=o.tasks.filter(k=>!k.done);});
  body.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{const p=sugs[+b.dataset.sug]; edit(id,o=>{o.tasks=o.tasks||[]; o.tasks.push({id:uid(),text:L(p),done:false,due:null,urgent:false});});});
  const rn=body.querySelector('#renameIn'); rn.onchange=()=>edit(id,o=>{const v=rn.value.trim().slice(0,40); if(v) o.title=v; else delete o.title;});
  body.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>edit(id,o=>{o.color=b.dataset.col;}));
  body.querySelector('[data-remove]').onclick=()=>{ if(!removeArmed){ removeArmed=true; renderArea(id); return; }
    removeArmed=false; closeSheet();
    if(AREAS[id]) edit(id,o=>{o.hidden=true;}); else { delete saved[id]; persist(id); refresh(); } };
});}

function renderAdd(){
  const hiddenDefaults=Object.keys(AREAS).filter(k=>saved[k]&&saved[k].hidden);
  const usedPresets=new Set(Object.values(saved).filter(s=>s.custom&&s.preset&&!s.hidden).map(s=>s.preset));
  const presets=Object.keys(PRESETS).filter(k=>!usedPresets.has(k));
  const draft=body.querySelector('#ownName')?.value||'';
  body.innerHTML=`<div class="sh-head"><div><h2 id="shTitle">${t().addT}</h2><div class="sub">${t().addD}</div></div>
    <button class="x" aria-label="${t().close}" data-close>×</button></div>
    <div class="sec"><div class="catalog">
      ${hiddenDefaults.map(k=>`<button data-restore="${k}"><span class="badge" style="background:${AREAS[k].color}">${AREAS[k].initial}</span><span>${AREAS[k].name[lang]}<small>${AREAS[k].role[lang]}</small></span></button>`).join('')}
      ${presets.map(k=>`<button data-preset="${k}"><span class="badge" style="background:${PRESETS[k].color}">${PRESETS[k].initial}</span><span>${PRESETS[k].name[lang]}<small>${PRESETS[k].role[lang]}</small></span></button>`).join('')}
    </div></div>
    <div class="sec"><h3>${t().own}</h3><form class="custom" id="ownForm">
      <input class="field" id="ownName" type="text" maxlength="40" placeholder="${esc(t().ownName)}" value="${esc(draft)}" required>
      <label class="sub" for="ownKind">${t().prop}</label>
      <select id="ownKind">${Object.keys(KINDS).map(k=>`<option value="${k}">${L(KINDS[k])}</option>`).join('')}</select>
      <div class="sw-row">${SWATCHES.map((c,i)=>`<button type="button" data-oc="${c}" style="background:${c}" aria-pressed="${i===8}" aria-label="${c}"></button>`).join('')}</div>
      <button class="btn primary" type="submit">${t().create}</button></form></div>`;
  body.querySelector('[data-close]').onclick=closeSheet;
  const nextOrder=()=>Math.max(7,...ids().map(i=>area(i).order))+1;
  body.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{ const k=b.dataset.restore; edit(k,o=>{delete o.hidden; o.order=nextOrder();}); openArea(k); });
  body.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ const k='c'+Date.now().toString(36); const p=PRESETS[b.dataset.preset];
    edit(k,o=>{Object.assign(o,{custom:true,preset:b.dataset.preset,kind:p.kind,color:p.color,order:nextOrder(),tasks:[],goal:''});}); openArea(k); });
  let oc=SWATCHES[8];
  body.querySelectorAll('[data-oc]').forEach(b=>b.onclick=()=>{ oc=b.dataset.oc; body.querySelectorAll('[data-oc]').forEach(x=>x.setAttribute('aria-pressed',x===b)); });
  body.querySelector('#ownForm').onsubmit=e=>{ e.preventDefault(); const name=body.querySelector('#ownName').value.trim(); if(!name) return;
    const k='c'+Date.now().toString(36);
    edit(k,o=>{Object.assign(o,{custom:true,title:name.slice(0,40),kind:body.querySelector('#ownKind').value,color:oc,order:nextOrder(),tasks:[],goal:''});}); openArea(k); };
}
addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

$('btnDay').onclick=()=>{ night=!night; pref.set('night',night); applyMode(); renderUI(); };
$('btnLang').onclick=()=>{ lang=lang==='en'?'ar':'en'; pref.set('lang',lang); renderUI(); };
$('btnReset').onclick=()=>fit(true);
$('btnAdd').onclick=openAdd;

const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down||Math.hypot(e.clientX-down.x,e.clientY-down.y)>6) return; down=null;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr,camera);
  const targets=Object.values(rooms).map(r=>r.hit); if(ghost) targets.push(ghost.hit);
  const hit=ray.intersectObjects(targets)[0];
  if(hit){ hit.object.userData.room==='__add'?openAdd():openArea(hit.object.userData.room); } else closeSheet();
});
controls.addEventListener('start',()=>{ $('hint').style.opacity=0; });
setTimeout(()=>{ $('hint').style.opacity=0; },4500);
setInterval(renderUI,60000); // due dates roll over

// ---------- loop ----------
const v=new THREE.Vector3(), clock=new THREE.Clock();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function place(tag,anchor){ v.copy(anchor).project(camera); tag.style.transform=`translate(${(v.x+1)/2*innerWidth}px,${(1-v.y)/2*innerHeight}px) translate(-50%,-100%)`; }
function frame(){
  const tt=clock.getElapsedTime(); controls.update();
  Object.values(rooms).forEach(r=>{ const s=status(area(r.id)), ch=r.ch;
    r.ring.material.color.setHex(statusColor[s]); r.ring.visible=s!=='idle';
    r.scr.material.color.set(s==='error'?(Math.sin(tt*6)>0?'#fb7185':'#3a0d18'):s==='idle'?'#222a44':r.color);
    if(reduce){ ch.arms.forEach(a=>a.rotation.z=0); ch.head.rotation.set(0,0,0); }
    else if(s==='working'){ r.ring.scale.setScalar(1); r.ring.rotation.z=-tt*4; ch.arms[0].rotation.z=Math.sin(tt*14)*.12; ch.arms[1].rotation.z=Math.cos(tt*14)*.12; ch.head.rotation.set(0,0,Math.sin(tt*2)*.05); }
    else if(s==='error'){ r.ring.rotation.z=0; r.ring.scale.setScalar(1+Math.sin(tt*6)*.15); ch.head.rotation.set(0,Math.sin(tt*5)*.4,0); ch.arms.forEach(a=>a.rotation.z=.6); }
    else if(s==='done'){ r.ring.rotation.z=0; r.ring.scale.setScalar(1); ch.arms.forEach((a,i)=>a.rotation.z=1.3+Math.sin(tt*3+i)*.15); ch.head.rotation.set(0,0,.1); }
    else { ch.arms.forEach(a=>a.rotation.z=-.2); ch.head.rotation.set(0,-.5,-.15+Math.sin(tt*1.2)*.04); }
    if(!reduce){ const u=r.prop.userData;
      if(u.spin) u.spin.rotation.y=tt*(s==='working'?1.2:.2);
      if(u.bar&&s==='working') u.bar.forEach(o=>o.position.y=1.2+Math.max(0,Math.sin(tt*3))*.25);
      if(u.flame) u.flame.scale.setScalar(1+Math.sin(tt*9)*.15); }
    place(r.tag,r.anchor); });
  if(ghost){ place(ghost.tag,ghost.anchor); if(!reduce) ghost.plus.rotation.y=tt; }
  renderer.render(scene,camera); requestAnimationFrame(frame);
}

refresh();
initStore();
frame();
})();
</script>
